# Automatic tests on every push and every pull request.
#
# They make NO call to a model: neither Ollama nor an API key is available
# here, and that is deliberate. Everything that needs a model lives in
# evaluation/ and is run by hand (see the README).
#
# Windows is in the matrix because it is the project's development
# platform: paths and encoding behave differently there, and a
# Windows-only regression would otherwise go unnoticed.

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run the tests
        run: python -m pytest
