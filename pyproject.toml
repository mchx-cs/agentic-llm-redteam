[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-llm-redteam"
version = "0.6.0"
description = "Multi-agent red teaming of LLM applications, following the OWASP Top 10 for LLM Applications"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Clément Monchaux" }]
keywords = ["llm", "security", "red-teaming", "prompt-injection", "owasp"]

# A single runtime dependency: the openai SDK talks to Ollama just as well as
# to remote APIs. The development tools are separate, below.
dependencies = ["openai>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# PyRIT supplies the multi-turn attack algorithms (phase 3b). An EXTRA, so
# that `pip install .` stays one dependency and the repository keeps running
# with nothing. NOTE: PyRIT requires Python >= 3.11 since its 1.2.0, while
# this project declares >= 3.10 -- so on 3.10 this extra is not installable,
# and pip says so. Dropping 3.10 is a published promise, not broken for an
# optional feature. See requirements-pyrit.txt for the full reasoning.
pyrit = ["pyrit>=1.2.1,<1.3"]

[project.urls]
Repository = "https://github.com/mchx-cs/agentic-llm-redteam"

[project.scripts]
# Allows `redteam --target …` once the package is installed, without
# replacing `python main.py`, still the simplest way to try the repository.
redteam = "main:cli"

[tool.setuptools]
py-modules = ["main", "config", "llm_client", "report", "stats", "audit", "migration"]

[tool.setuptools.packages.find]
include = ["agents*", "targets*", "payloads*", "evaluation*", "pyrit_bridge*"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests must NEVER call a model: they run in continuous integration, where
# there is neither Ollama nor an API key. What needs a model lives in
# evaluation/ and is run by hand.
addopts = "-q --strict-markers"
